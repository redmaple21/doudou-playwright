name: Playwright Tests & Scheduled Signin
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        # 每天 UTC 23:30 执行（北京时间 07:30）
        - cron: '30 23 * * *'
    workflow_dispatch: # 手动触发
jobs:
    signin:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        env:
            TARGET_URL: ${{ secrets.TARGET_URL }}
            LOGIN_URL: ${{ secrets.LOGIN_URL }}
            LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
            LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
            SIGNIN_URL: ${{ secrets.SIGNIN_URL }}
            HEADLESS: 'true'
            TIMEOUT: '30000'
            IYUU_TOKEN: ${{ secrets.IYUU_TOKEN }}
            WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
            # push/PR 不重试，定时或手动触发使用默认重试
            RETRIES: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '0' || '2' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Cache Playwright Browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Cache OCR model
              uses: actions/cache@v4
              with:
                  path: storage/onnx
                  key: ddddocr-common-old-v1
                  restore-keys: |
                      ddddocr-common-old-

            - name: Create storage directories
              run: mkdir -p storage/cookies storage/screenshots storage/logs storage/onnx

            # 复用上次成功登录的 Cookie，避免每次都走验证码登录
            - name: Restore cookies
              uses: actions/cache@v4
              with:
                  path: storage/cookies
                  key: signin-cookies-${{ github.run_id }}
                  restore-keys: |
                      signin-cookies-

            # 缓存为空时，用仓库 Secret 注入本地导出的 storageState
            - name: Seed cookies from secret
              env:
                  STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE }}
              run: |
                  if [ -f storage/cookies/auth.json ]; then
                    echo "已使用缓存中的 Cookie"
                  elif [ -n "$STORAGE_STATE" ]; then
                    printf '%s\n' "$STORAGE_STATE" > storage/cookies/auth.json
                    echo "已从 PLAYWRIGHT_STORAGE_STATE 写入 Cookie"
                  else
                    echo "无缓存 Cookie，将走 OCR 识别验证码登录"
                  fi

            - name: Run auto signin
              run: npm run signin

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: signin-logs
                  path: |
                      storage/logs/
                      storage/screenshots/
                  retention-days: 7
